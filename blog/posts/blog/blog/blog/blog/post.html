<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog | Dr. Monirujjaman Kaium</title>
<link rel="stylesheet" href="/blog/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/blog/">← All posts</a><a href="/">Home</a></div>
  <article class="post"><h1 id="title">Loading…</h1><div class="date" id="date"></div><div id="body"></div></article>
  <p class="note">Medical information here is general education and is not a substitute for care from your own doctor.</p>
</div>
<script>
var slug=new URLSearchParams(location.search).get('p')||'';
function fail(){document.getElementById('title').textContent='Post not found';document.getElementById('body').innerHTML='<p><a href="/blog/">Back to all posts</a></p>'}
if(!/^[a-z0-9-]+$/.test(slug)){fail()}else{
  Promise.all([
    fetch('/blog/posts.json').then(function(r){return r.json()}),
    fetch('/blog/posts/'+slug+'.md').then(function(r){if(!r.ok)throw 0;return r.text()})
  ]).then(function(res){
    var meta=res[0].filter(function(p){return p.slug===slug})[0];
    var title=meta?meta.title:slug;
    document.title=title+' | Dr. Monirujjaman Kaium';
    document.getElementById('title').textContent=title;
    if(meta)document.getElementById('date').textContent=new Date(meta.date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
    document.getElementById('body').innerHTML=marked.parse(res[1]);
  }).catch(fail);
}
</script>
</body>
</html>
